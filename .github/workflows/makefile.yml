name: Build (legacy)

# Kept for compatibility – main workflow is build.yml
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pablomk7/libctrpf:0.8.0

    steps:
      - uses: actions/checkout@v4
      - run: make
      - uses: actions/upload-artifact@v4
        with:
          name: ctrWWG-Plugin
          path: |
            *.3gx
            *.elf
